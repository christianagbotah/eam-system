version: '3.8'
services:
  mariadb:
    image: mariadb:11.4
    container_name: repairs-uat-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: uat_test_root
      MARIADB_DATABASE: repairs_uat
      MARIADB_USER: repairs_uat
      MARIADB_PASSWORD: repairs_uat_pass
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repairs-uat-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data: