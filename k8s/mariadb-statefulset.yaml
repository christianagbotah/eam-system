apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: iassetspro-eam
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
      annotations:
        prometheus.io/scrape: "false"
    spec:
      terminationGracePeriodSeconds: 60
      # ── Init Container: charset / collation bootstrap ─────────
      initContainers:
        - name: init-db
          image: mariadb:11.4
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until mysqladmin ping -h mariadb -u root --silent; do
                echo "Waiting for MariaDB to be ready..."
                sleep 2
              done
              echo "MariaDB is ready — running charset setup..."
              mysql -h mariadb -u root <<'SQL'
              ALTER DATABASE IF EXISTS iassetspro
                CHARACTER SET utf8mb4
                COLLATE utf8mb4_unicode_ci;
              SQL
              echo "Charset/collation setup complete."
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
      # ── Main Container ───────────────────────────────────────
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iassetspro-secrets
                  key: MARIADB_ROOT_PASSWORD
                  optional: false
            - name: MARIADB_DATABASE
              value: iassetspro
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: iassetspro-secrets
                  key: MARIADB_USER
                  optional: true
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iassetspro-secrets
                  key: MARIADB_PASSWORD
                  optional: true
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
            - --slow-query-log=1
            - --slow-query-log-file=/var/log/mysql/mariadb-slow.log
            - --long-query-time=2
            - --log-queries-not-using-indexes=1
            - --innodb-buffer-pool-size=256M
            - --max-connections=200
            - --query-cache-size=64M
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          # ── Liveness Probe ───────────────────────────────────
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # ── Readiness Probe ──────────────────────────────────
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # ── Volume Mounts ────────────────────────────────────
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: slow-query-log
              mountPath: /var/log/mysql
      # ── Volumes ──────────────────────────────────────────────
      volumes:
        - name: slow-query-log
          emptyDir: {}
  # ── Persistent Volume Claim ──────────────────────────────────
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
        labels:
          app.kubernetes.io/name: mariadb
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard  # Adjust to match your cluster's StorageClass
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app.kubernetes.io/name: mariadb
