# ⚠️ IMPORTANT: Before deploying, update the following:
#   1. Replace `iassetspro.example.com` with your actual domain
#   2. Create TLS secret or configure cert-manager for auto-provisioning
#   3. Ensure the nginx ingress controller is installed in your cluster
#   4. For cert-manager auto-TLS, uncomment the cert-manager annotations
#      and remove the manual tls secret reference

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iassetspro-ingress
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: iassetspro-app
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: iassetspro-eam
  annotations:
    # ── nginx-ingress controller annotations ────────────────────
    nginx.ingress.kubernetes.io/ingress.class: nginx

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Timeouts (Next.js SSR can be slow on first request)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"

    # WebSocket support (for Socket.IO notification service)
    nginx.ingress.kubernetes.io/websocket-services: "app-service,notification-service"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:;";

    # cert-manager auto-TLS (uncomment and configure if using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - iassetspro.example.com  # ⚠️ Replace with your actual domain
      secretName: iassetspro-tls  # Create this secret manually or use cert-manager
  rules:
    - host: iassetspro.example.com  # ⚠️ Replace with your actual domain
      http:
        paths:
          # ── Main application ─────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80

          # ── Notification service (Socket.IO / WebSocket) ────
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 80
