# ── Default Deny All Ingress ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: iassetspro
  labels:
    app.kubernetes.io/part-of: iassetspro-eam
    policy: deny-all
spec:
  podSelector: {}    # Applies to all pods in the namespace
  policyTypes:
    - Ingress
---
# ── Default Deny All Egress ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: iassetspro
  labels:
    app.kubernetes.io/part-of: iassetspro-eam
    policy: deny-all
spec:
  podSelector: {}    # Applies to all pods in the namespace
  policyTypes:
    - Egress
---
# ── Allow ingress controller → app ─────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-app
  namespace: iassetspro
  labels:
    app.kubernetes.io/component: application
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iassetspro-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Allow traffic from the ingress controller namespace
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        # Allow traffic from within the namespace (for inter-pod communication)
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
---
# ── Allow app → MariaDB ────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-mariadb
  namespace: iassetspro
  labels:
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iassetspro-app
      ports:
        - protocol: TCP
          port: 3306
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mariadb
      ports:
        - protocol: TCP
          port: 3306
---
# ── Allow app → Redis ──────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis
  namespace: iassetspro
  labels:
    app.kubernetes.io/component: cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iassetspro-app
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
---
# ── Allow app → notification-service ───────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-notification-service
  namespace: iassetspro
  labels:
    app.kubernetes.io/component: notifications
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}  # Any pod in namespace (ingress → app → WS)
      ports:
        - protocol: TCP
          port: 3004
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
      ports:
        - protocol: TCP
          port: 3004
---
# ── Allow app egress to DNS ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-dns-egress
  namespace: iassetspro
  labels:
    app.kubernetes.io/component: application
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iassetspro-app
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ── Allow MariaDB + Redis DNS egress ───────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infra-dns-egress
  namespace: iassetspro
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
