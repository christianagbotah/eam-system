apiVersion: v1
kind: ConfigMap
metadata:
  name: iassetspro-config
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: iassetspro
    app.kubernetes.io/component: config
data:
  # ── Application ──────────────────────────────────────────────
  APP_NAME: "iAssetsPro EAM"
  APP_ENV: "production"
  APP_URL: "https://iassetspro.example.com"
  PORT: "3000"
  LOG_LEVEL: "info"

  # ── Next.js ──────────────────────────────────────────────────
  NEXT_TELEMETRY_DISABLED: "1"

  # ── Database (non-sensitive) ────────────────────────────────
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "10"

  # ── Redis (non-sensitive) ───────────────────────────────────
  REDIS_DB: "0"
  REDIS_KEY_PREFIX: "iamsp:"

  # ── BullMQ ──────────────────────────────────────────────────
  BULLMQ_CONCURRENCY: "5"
  BULLMQ_MAX_RETRIES: "3"
  BULLMQ_REMOVE_ON_COMPLETE_COUNT: "100"
  BULLMQ_REMOVE_ON_FAIL_COUNT: "200"

  # ── Feature Flags ───────────────────────────────────────────
  ENABLE_NOTIFICATIONS: "true"
  ENABLE_EMAIL: "true"
  ENABLE_WEBSOCKET: "true"
  ENABLE_FILE_UPLOADS: "true"
  ENABLE_ESCALATION: "true"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_SLOW_QUERY_LOG: "true"
  SLOW_QUERY_THRESHOLD_MS: "1000"
  ENABLE_REQUEST_LOGGING: "true"

  # ── File Uploads ────────────────────────────────────────────
  MAX_FILE_SIZE_MB: "10"
  UPLOAD_DIR: "/app/data/uploads"

  # ── Session ─────────────────────────────────────────────────
  SESSION_MAX_AGE_HOURS: "24"
  SESSION_ABSOLUTE_TIMEOUT_HOURS: "48"
