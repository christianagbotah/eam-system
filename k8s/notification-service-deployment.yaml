apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: notifications
    app.kubernetes.io/part-of: iassetspro-eam
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: notifications
    spec:
      terminationGracePeriodSeconds: 30

      # ── Init: wait for Redis ────────────────────────────────
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is reachable."
          resources:
            limits:
              memory: 64Mi
              cpu: 50m

      containers:
        - name: notification-service
          image: iassetspro/notification-service:latest  # Replace with your image registry path
          ports:
            - name: socketio
              containerPort: 3004
              protocol: TCP
            - name: admin-api
              containerPort: 3005
              protocol: TCP
          env:
            - name: PORT
              value: "3004"
            - name: ADMIN_PORT
              value: "3005"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: iassetspro-config
                  key: APP_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: iassetspro-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: iassetspro-config
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "0.5"
          # ── Liveness Probe ───────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: admin-api
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # ── Readiness Probe ──────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health
              port: admin-api
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
---
# ── Service: Socket.IO (primary, for ingress) ─────────────────
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: notifications
spec:
  type: ClusterIP
  ports:
    - name: socketio
      port: 80
      targetPort: 3004
      protocol: TCP
    - name: admin-api
      port: 3005
      targetPort: 3005
      protocol: TCP
  selector:
    app.kubernetes.io/name: notification-service
