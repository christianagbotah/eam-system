apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iassetspro-app-hpa
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: iassetspro-app
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: iassetspro-eam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iassetspro-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # ── CPU-based scaling ──────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # ── Memory-based scaling ───────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # ── Scale-up: respond quickly to spikes ────────────────────
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60       # Add 1 pod every 60s
        - type: Percent
          value: 50
          periodSeconds: 120      # Or add 50% of current pods every 2min
      selectPolicy: Max
    # ── Scale-down: be conservative to avoid thrashing ─────────
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300      # Remove 1 pod every 5min
      selectPolicy: Min
