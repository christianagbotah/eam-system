apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iassetspro-eam
spec:
  replicas: 1
  strategy:
    type: Recreate  # Avoid split-brain with single-tenant persistence
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
      annotations:
        prometheus.io/scrape: "false"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          args:
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "900"
            - "1"
            - --save
            - "300"
            - "10"
            - --save
            - "60"
            - "10000"
            - --tcp-keepalive
            - "300"
            - --loglevel
            - notice
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: "0.5"
          # ── Liveness Probe ───────────────────────────────────
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # ── Readiness Probe ──────────────────────────────────
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # ── Volume Mount ─────────────────────────────────────
          volumeMounts:
            - name: redis-data
              mountPath: /data
      # ── Volumes ──────────────────────────────────────────────
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
# ── PVC for Redis persistence ─────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard  # Adjust to match your cluster's StorageClass
---
# ── Service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: iassetspro
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: redis
