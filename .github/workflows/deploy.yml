# =============================================================================
# iAssetsPro EAM — Deployment Pipeline
# =============================================================================
# Automatic production deployment is triggered only after the main CI workflow
# completes successfully. The workflow builds an immutable GHCR image for the
# exact CI-tested SHA, deploys it via Compose, then runs a production smoke test.
#
# REQUIRED GITHUB SECRETS:
#   DEPLOY_HOST             — VPS IP or domain
#   DEPLOY_USER             — SSH username
#   DEPLOY_SSH_KEY          — Full SSH private key
#   DEPLOY_PORT             — SSH port (default: 22)
#   DEPLOY_PATH             — App path on VPS (default: /opt/iassetspro)
#   PRODUCTION_URL          — Production URL for smoke tests
#
# GHCR authentication uses the workflow-scoped GITHUB_TOKEN. No long-lived
# registry username/PAT secrets are required.
#
# OPTIONAL SECRETS:
#   SLACK_WEBHOOK_URL       — Slack webhook for deploy notifications
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip waiting for the CI E2E check for this main commit"
        type: boolean
        default: false

# Least privileges required to read repository contents and publish/pull the
# deployment image from this repository's GHCR namespace.
permissions:
  contents: read
  packages: write

# Only one production deployment at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/iassetspro-eam
  # workflow_run.github.sha points to the workflow definition/default branch,
  # not necessarily the CI-tested application commit. Always carry the tested
  # head SHA explicitly through build, image tag, VPS deployment, and summary.
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Job: Deploy to Production
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A failed/cancelled automatic CI run must never create a deployment job.
    # Manual dispatch remains an explicit operator action, restricted to main.
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}

    steps:
      # Automatic workflow_run deploys arrive only after CI is already green.
      # A manual deploy keeps the previous default behavior: wait for the final
      # E2E check unless the operator explicitly chooses skip_tests.
      - name: Wait for full CI to succeed for manual deploy
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_tests }}
        uses: fountainhead/action-wait-for-check@v1.0.0
        with:
          token: ${{ github.token }}
          checkName: E2E Tests (Playwright)
          ref: ${{ env.RELEASE_SHA }}
          timeoutSeconds: 2100

      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate immutable version tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.RELEASE_SHA }}

      - name: Build and push validated Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BUILD_VERSION=${{ env.RELEASE_SHA }}

      - name: Prepare VPS deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: mkdir -p "${{ secrets.DEPLOY_PATH || '/opt/iassetspro' }}"

      - name: Upload production Compose manifest
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH || '/opt/iassetspro' }}
          overwrite: true

      - name: Deploy immutable image to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/iassetspro' }}"
            IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.RELEASE_SHA }}"

            echo "========================================="
            echo "  iAssetsPro EAM — Production Deploy"
            echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "  Commit: ${{ env.RELEASE_SHA }}"
            echo "  Image: $IMAGE_TAG"
            echo "========================================="

            cd "$DEPLOY_PATH"
            test -f docker-compose.yml
            test -f .env

            # Use the short-lived workflow token to pull the exact immutable
            # image built for this CI-tested commit, then remove credentials.
            echo "${{ github.token }}" | docker login ${{ env.DOCKER_REGISTRY }} \
              -u "${{ github.actor }}" --password-stdin

            echo ""
            echo "[1/3] Pulling immutable release image..."
            APP_IMAGE="$IMAGE_TAG" docker compose pull app
            docker logout ${{ env.DOCKER_REGISTRY }} >/dev/null 2>&1 || true
            echo "  Image pulled successfully"

            echo ""
            echo "[2/3] Recreating application from validated image..."
            APP_IMAGE="$IMAGE_TAG" docker compose up -d --no-build --force-recreate app
            echo "  Application service recreated"

            echo ""
            echo "[3/3] Cleaning up unused images..."
            docker image prune -f

            echo ""
            echo "========================================="
            echo "  Deploy Complete!"
            echo "========================================="

      - name: Run smoke test against production
        run: |
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PRODUCTION_URL" ]; then
            echo "⚠️  PRODUCTION_URL secret not set — skipping smoke test"
            exit 0
          fi

          echo "Running smoke test against $PRODUCTION_URL ..."

          MAX_RETRIES=12
          RETRY_DELAY=10

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${PRODUCTION_URL}/api/health" --max-time 10 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Smoke test PASSED — API health endpoint returned HTTP 200"
              exit 0
            fi

            echo "  Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE (retrying in ${RETRY_DELAY}s)..."
            sleep $RETRY_DELAY
          done

          echo "❌ Smoke test FAILED — health endpoint did not return 200 after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment summary — Success
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ env.RELEASE_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ env.RELEASE_BRANCH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | \`sha-${{ env.RELEASE_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Deployment summary — Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ env.RELEASE_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ env.RELEASE_BRANCH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed step** | ${{ github.job }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Action required** | Check logs above for details |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚡ [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "✅ *iAssetsPro EAM* deployed to production\nCommit: `'${{ env.RELEASE_SHA }}'` by '${{ github.actor }}'\nBranch: `${{ env.RELEASE_BRANCH }}`"
            }' || true

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "❌ *iAssetsPro EAM* deployment FAILED\nCommit: `'${{ env.RELEASE_SHA }}'`\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }' || true
