# =============================================================================
# iAssetsPro EAM — Deployment Pipeline
# =============================================================================
# Triggers on push to main after the full CI pipeline passes.
# Builds Docker image, pushes to GHCR, deploys via SSH, runs smoke test.
#
# REQUIRED GITHUB SECRETS:
#   DEPLOY_HOST             — VPS IP or domain
#   DEPLOY_USER             — SSH username
#   DEPLOY_SSH_KEY          — Full SSH private key
#   DEPLOY_PORT             — SSH port (default: 22)
#   DEPLOY_PATH             — App path on VPS (default: /opt/iassetspro)
#   PRODUCTION_URL          — Production URL for smoke tests
#
# GHCR authentication uses the workflow-scoped GITHUB_TOKEN. No long-lived
# registry username/PAT secrets are required.
#
# OPTIONAL SECRETS:
#   SLACK_WEBHOOK_URL       — Slack webhook for deploy notifications
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip waiting for CI pipeline"
        type: boolean
        default: false

# Least privileges required to read repository contents and publish/pull the
# deployment image from this repository's GHCR namespace.
permissions:
  contents: read
  packages: write

# Only one deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/iassetspro-eam

jobs:
  # ---------------------------------------------------------------------------
  # Job: Deploy to Production
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Automatic production deployment must wait for the final push-only E2E
    # gate, not merely the Build job. Build can be green while the broader
    # Playwright suite is still running or has failed.
    steps:
      - name: Wait for full CI to succeed
        if: ${{ !inputs.skip_tests }}
        uses: fountainhead/action-wait-for-check@v1.0.0
        id: wait-for-ci
        with:
          token: ${{ github.token }}
          checkName: E2E Tests (Playwright)
          ref: ${{ github.sha }}
          timeoutSeconds: 900

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BUILD_VERSION=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/iassetspro' }}"
            IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            echo "========================================="
            echo "  iAssetsPro EAM — Production Deploy"
            echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "  Commit: ${{ github.sha }}"
            echo "========================================="

            # Ensure deploy directory exists
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Copy docker-compose from repo if it doesn't exist
            if [ ! -f docker-compose.yml ]; then
              echo "[WARN] docker-compose.yml not found — expecting pre-staged on VPS"
            fi

            # Use the short-lived workflow token to pull the image. This avoids
            # storing a long-lived GHCR PAT on the repository or the VPS.
            echo "${{ github.token }}" | docker login ${{ env.DOCKER_REGISTRY }} \
              -u "${{ github.actor }}" --password-stdin

            # Pull the latest image
            echo ""
            echo "[1/3] Pulling latest Docker image..."
            docker compose pull app 2>&1 || docker pull "$IMAGE_TAG" 2>&1
            docker logout ${{ env.DOCKER_REGISTRY }} >/dev/null 2>&1 || true
            echo "  Image pulled successfully"

            # Restart services
            echo ""
            echo "[2/3] Restarting services..."
            docker compose up -d --force-recreate app 2>&1 || \
              docker run -d --name iassetspro-app \
                --restart unless-stopped \
                -p 3000:3000 \
                --env-file .env \
                "$IMAGE_TAG"
            echo "  Services restarted"

            # Clean up old images
            echo ""
            echo "[3/3] Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "========================================="
            echo "  Deploy Complete!"
            echo "========================================="

      - name: Run smoke test against production
        run: |
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PRODUCTION_URL" ]; then
            echo "⚠️  PRODUCTION_URL secret not set — skipping smoke test"
            exit 0
          fi

          echo "Running smoke test against $PRODUCTION_URL ..."

          # Wait for the server to be ready
          MAX_RETRIES=12
          RETRY_DELAY=10

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${PRODUCTION_URL}/api/health" --max-time 10 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Smoke test PASSED — API health endpoint returned HTTP 200"
              exit 0
            fi

            echo "  Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE (retrying in ${RETRY_DELAY}s)..."
            sleep $RETRY_DELAY
          done

          echo "❌ Smoke test FAILED — health endpoint did not return 200 after $MAX_RETRIES attempts"
          exit 1

      # --- Success notification ---
      - name: Deployment summary — Success
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | \`latest\` + \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      # --- Failure notification ---
      - name: Deployment summary — Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed step** | ${{ github.job }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Action required** | Check logs above for details |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚡ [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      # --- Optional Slack notification ---
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "✅ *iAssetsPro EAM* deployed to production\nCommit: `'${{ github.sha }}'` by '${{ github.actor }}'\nBranch: `${{ github.ref_name }}`"
            }' || true

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "❌ *iAssetsPro EAM* deployment FAILED\nCommit: `'${{ github.sha }}'`\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }' || true
