# =============================================================================
# Auto-Deploy to Webuzo VPS on push to main
# =============================================================================
# Triggers: Every push to 'main' branch
# What it does:
#   1. SSH into the VPS
#   2. Pulls latest code from GitHub
#   3. Installs dependencies
#   4. Copies prebuilt Prisma client
#   5. Builds Next.js (standalone)
#   6. Copies static assets into standalone
#   7. Patches server for Webuzo proxy
#   8. Restarts the PM2 process
#
# ONE-TIME SETUP REQUIRED:
#   1. Add these GitHub Secrets (Settings > Secrets and variables > Actions):
#      - VPS_HOST       → Your VPS IP or domain (e.g. 103.x.x.x)
#      - VPS_USER       → SSH username (e.g. root, or your Webuzo user)
#      - VPS_SSH_KEY    → Full private key contents (cat ~/.ssh/id_rsa)
#      - VPS_PORT       → SSH port (default: 22)
#      - VPS_APP_PATH   → App path on VPS (e.g. /root/eam-system)
#
#   2. Run scripts/webuzo-setup.sh ONCE on the VPS to prepare it
# =============================================================================

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

concurrency:
  group: vps-deploy
  cancel-in-progress: true  # Only one deploy at a time

jobs:
  deploy:
    name: Deploy to Webuzo VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            APP_PATH="${{ secrets.VPS_APP_PATH || '/root/eam-system' }}"

            echo "========================================="
            echo "  EAM Auto-Deploy to Webuzo VPS"
            echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "========================================="

            # ── Step 1: Pull latest code ──
            echo ""
            echo "[1/7] Pulling latest code..."
            cd "$APP_PATH"
            git fetch origin main
            git reset --hard origin/main
            echo "  Current commit: $(git log --oneline -1)"

            # ── Step 2: Install dependencies ──
            echo ""
            echo "[2/7] Installing dependencies..."
            npm install --legacy-peer-deps 2>&1 | tail -5
            echo "  Dependencies installed"

            # ── Step 3: Copy prebuilt Prisma client ──
            echo ""
            echo "[3/7] Setting up Prisma client..."
            if [ -d "prisma/prebuilt/.prisma" ]; then
              cp -r prisma/prebuilt/.prisma node_modules/.prisma
              echo "  Prebuilt Prisma client copied"
            else
              npx prisma generate
              echo "  Prisma client generated (no prebuilt found)"
            fi

            # ── Step 4: Build Next.js ──
            echo ""
            echo "[4/7] Building Next.js (standalone)..."
            export NEXT_TELEMETRY_DISABLED=1
            npx next build 2>&1 | tail -10
            echo "  Build complete"

            # ── Step 5: Copy assets into standalone ──
            echo ""
            echo "[5/7] Copying static assets to standalone..."
            cp -r node_modules/.prisma/client .next/standalone/node_modules/.prisma/client
            cp -r node_modules/@prisma/adapter-mariadb .next/standalone/node_modules/@prisma/adapter-mariadb 2>/dev/null || true
            cp -r node_modules/mariadb .next/standalone/node_modules/mariadb 2>/dev/null || true
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/
            echo "  Assets copied"

            # ── Step 6: Patch server for Webuzo proxy ──
            echo ""
            echo "[6/7] Patching server for reverse proxy..."
            if [ -f "patch-server.js" ]; then
              node patch-server.js
              echo "  Server patched"
            else
              echo "  No patch-server.js found, skipping"
            fi

            # ── Step 7: Restart the service ──
            echo ""
            echo "[7/7] Restarting service..."
            if command -v pm2 &> /dev/null; then
              pm2 restart eam-system 2>/dev/null || pm2 start npm --name eam-system -- start
              pm2 save
              echo "  PM2 restarted successfully"
            elif command -v systemctl &> /dev/null && sudo systemctl is-enabled eam-system 2>/dev/null; then
              sudo systemctl restart eam-system
              echo "  systemd service restarted"
            else
              echo "  WARNING: No process manager found!"
              echo "  Run: pm2 start npm --name eam-system -- start"
              exit 1
            fi

            echo ""
            echo "========================================="
            echo "  Deploy Complete!"
            echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "========================================="

            # Health check
            echo ""
            echo "Running health check..."
            sleep 5
            for i in $(seq 1 8); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ --max-time 5 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "307" ]; then
                echo "  Health check PASSED (HTTP $HTTP_CODE)"
                exit 0
              fi
              echo "  Attempt $i/8: HTTP $HTTP_CODE (retrying in 5s)..."
              sleep 5
            done
            echo "  WARNING: Health check did not pass. Check PM2 logs: pm2 logs eam-system"
            exit 0  # Don't fail the workflow - deploy itself succeeded
