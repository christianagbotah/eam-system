# =============================================================================
# Auto-Deploy to Google Cloud Compute Engine on push to main
# =============================================================================
# Triggers: Every push to 'main' branch
# What it does:
#   1. SSH into the VM
#   2. Pulls latest code from GitHub
#   3. Installs dependencies
#   4. Generates Prisma client
#   5. Builds Next.js
#   6. Copies static assets into standalone
#   7. Restarts the PM2 process (zero-downtime reload)
#
# ONE-TIME SETUP REQUIRED:
#   1. Add these GitHub Secrets (Settings → Secrets and variables → Actions):
#      - VM_HOST       → Your VM's public IP (e.g. 35.202.xxx.xxx)
#      - VM_USER       → SSH username (e.g. ubuntu, admin)
#      - VM_SSH_KEY    → Full private key contents (cat ~/.ssh/id_rsa)
#      - VM_PORT       → SSH port (default: 22)
#
#   2. Run scripts/vm-setup.sh ONCE on the VM to configure it for auto-deploy
# =============================================================================

name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

concurrency:
  group: vm-deploy
  cancel-in-progress: true  # Only one deploy at a time

jobs:
  deploy:
    name: Deploy to Compute Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e

            echo "========================================="
            echo "  EAM Auto-Deploy Started"
            echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "========================================="

            # Navigate to project
            cd ~/eam-system

            # ── Step 1: Pull latest code ──
            echo ""
            echo "[1/6] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            echo "  Current commit: $(git log --oneline -1)"

            # ── Step 2: Install dependencies ──
            echo ""
            echo "[2/6] Installing dependencies..."
            npm install --legacy-peer-deps 2>&1 | tail -5
            echo "  Dependencies installed"

            # ── Step 3: Generate Prisma client ──
            echo ""
            echo "[3/6] Generating Prisma client..."
            npx prisma generate
            echo "  Prisma client generated"

            # ── Step 4: Build Next.js ──
            echo ""
            echo "[4/6] Building Next.js (this may take 2-3 minutes)..."
            export NEXT_TELEMETRY_DISABLED=1
            npx next build
            echo "  Build complete"

            # ── Step 5: Copy assets into standalone ──
            echo ""
            echo "[5/6] Copying static assets to standalone..."
            cp -r node_modules/.prisma/client .next/standalone/node_modules/.prisma/client
            cp -r node_modules/@prisma/adapter-mariadb .next/standalone/node_modules/@prisma/adapter-mariadb 2>/dev/null || true
            cp -r node_modules/mariadb .next/standalone/node_modules/mariadb 2>/dev/null || true
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/
            echo "  Assets copied"

            # ── Step 6: Restart the service ──
            echo ""
            echo "[6/6] Restarting service..."
            if command -v pm2 &> /dev/null; then
              pm2 restart eam-system || pm2 start npm --name eam-system -- start
              pm2 save
              echo "  PM2 restarted (zero-downtime reload)"
            elif command -v systemctl &> /dev/null && sudo systemctl is-enabled eam-system 2>/dev/null; then
              sudo systemctl restart eam-system
              echo "  systemd service restarted"
            elif command -v supervisorctl &> /dev/null; then
              sudo supervisorctl restart eam-system
              echo "  supervisor restarted"
            else
              echo "  WARNING: No process manager found!"
              echo "  Run: pm2 start npm --name eam-system -- start"
              exit 1
            fi

            echo ""
            echo "========================================="
            echo "  Deploy Complete!"
            echo "  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "========================================="

            # Health check
            echo ""
            echo "Running health check..."
            sleep 5
            for i in $(seq 1 6); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ --max-time 5 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "  Health check PASSED (HTTP $HTTP_CODE)"
                exit 0
              fi
              echo "  Attempt $i/6: HTTP $HTTP_CODE (retrying in 5s)..."
              sleep 5
            done
            echo "  WARNING: Health check did not pass. Check PM2 logs: pm2 logs eam-system"
            exit 0  # Don't fail the workflow - deploy itself succeeded
