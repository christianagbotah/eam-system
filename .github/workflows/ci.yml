# =============================================================================
# iAssetsPro EAM — Main CI Pipeline
# =============================================================================
# Triggers on pushes to main/develop and all pull requests.
# Jobs: lint → Repairs typecheck → unit-tests → build → Repairs UAT (PR) / E2E (push)
# Full-repository TypeScript debt is reported separately inside the typecheck job.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: TypeScript — Repairs Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run Repairs/RWOP TypeScript hard gate
        run: bunx tsc -p tsconfig.repairs.json --noEmit

      - name: Report full-repository TypeScript debt
        continue-on-error: true
        run: bunx tsc --noEmit

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application (prisma generate + next build + copy assets)
        run: bun run build:local

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/standalone
          retention-days: 7

  # Repairs/RWOP UAT is a hard PR gate. It runs against real MariaDB + Redis
  # service containers, verifies the deployed schema and BullMQ round-trip, then
  # exercises the exact standalone production artifact with Playwright.
  repairs-uat:
    name: Repairs UAT (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [build]
    if: github.event_name == 'pull_request'

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: uat_test_root
          MARIADB_DATABASE: repairs_uat
          MARIADB_USER: repairs_uat
          MARIADB_PASSWORD: repairs_uat_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://repairs_uat:repairs_uat_pass@127.0.0.1:3306/repairs_uat
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: repairs-uat-ci-nextauth-secret-not-for-production
      JWT_SECRET: repairs-uat-ci-jwt-secret-not-for-production-32-bytes-minimum
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Create isolated UAT schema
        run: bunx prisma db push --skip-generate

      - name: Seed Repairs UAT data
        run: bunx tsx scripts/seed-repairs-uat.ts

      - name: Run Repairs RC1 MariaDB/Redis/BullMQ preflight
        run: bun run test:repairs-rc1-preflight

      - name: Download production standalone build
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/standalone

      - name: Install Playwright Chromium browser with system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run Repairs/RWOP Playwright UAT
        run: bun run test:repairs-uat

      - name: Upload Repairs UAT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repairs-uat-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium browser with system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/standalone

      - name: Run Playwright E2E tests (Chromium only)
        env:
          PLAYWRIGHT_USE_PRODUCTION_SERVER: 1
        run: bun run test:e2e --project=chromium

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
